aid: italic
name: Italic
description: Italic is a direct-to-consumer home goods brand founded in 2018, bringing
  Mediterranean-inspired beauty to everyday living. The company sells premium bedding,
  bath towels and robes, beach cabana towels, cashmere throws, decor, and kitchenware
  (chef knives and flatware), organized into themed collections such as Havana, Amalfi,
  and Riviera. Italic operates a membership program, "Italic Bold," and runs a Shopify-based
  storefront with a customer help center, wholesale and trade programs, and an active
  blog. Backed by venture investors including Canaan Partners and Kindred Ventures,
  Italic is a consumer e-commerce retailer with no public developer API surface; this
  API Evangelist profile captures its company identity, website properties, and domain
  security posture.
